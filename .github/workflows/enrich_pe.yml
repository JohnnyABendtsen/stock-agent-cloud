name: Get missing PE

on:
  workflow_dispatch: {}   # manual only, from the Actions tab — no schedule

concurrency:
  group: update-data   # shares the group with the daily update so they never overlap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PE enrichment
        run: python enrich_pe.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "PE enrichment $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
