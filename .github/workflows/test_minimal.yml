name: Test Minimal

on:
  schedule:
    # 05:00 UTC daily — well before European market open, keeps runs off the
    # busiest window on GitHub's shared runners.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Only one update at a time; a new scheduled run won't queue up behind a slow one.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # full Europe run has taken up to ~2h; fail instead of hanging forever

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update
        run: python update_data.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.db assets/last_downloaded_markets.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated data update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
